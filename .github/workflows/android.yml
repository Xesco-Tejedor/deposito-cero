name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DC_KEYSTORE_B64: ${{ secrets.DC_KEYSTORE_B64 }}
      DC_KEYSTORE_PASS: ${{ secrets.DC_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 
      - name: Prepare Android source
        run: |
          mkdir -p android
          cat > android/MainActivity.java <<'FILE_END'
          package es.xescotejedor.depositocero;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.view.*;
          import android.webkit.*;
          public class MainActivity extends Activity {
           public WebView web;
           @Override public void onCreate(Bundle state){super.onCreate(state);
            getWindow().setStatusBarColor(Color.rgb(18,16,12));getWindow().setNavigationBarColor(Color.rgb(18,16,12));
            android.widget.FrameLayout root=new android.widget.FrameLayout(this);root.setBackgroundColor(Color.rgb(18,16,12));
            root.setOnApplyWindowInsetsListener((v,insets)->{root.setPadding(insets.getSystemWindowInsetLeft(),insets.getSystemWindowInsetTop(),insets.getSystemWindowInsetRight(),insets.getSystemWindowInsetBottom());return insets;});
            web=new WebView(this);root.addView(web);setContentView(root);web.setBackgroundColor(Color.rgb(18,16,12));
            WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(false);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(false);s.setMediaPlaybackRequiresUserGesture(true);
            web.setWebChromeClient(new WebChromeClient(){@Override public boolean onJsConfirm(WebView view,String url,String message,JsResult result){new AlertDialog.Builder(MainActivity.this).setMessage(message).setPositiveButton("Sí",(d,w)->result.confirm()).setNegativeButton("Cancelar",(d,w)->result.cancel()).setOnCancelListener(d->result.cancel()).show();return true;}});
            web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest request){Uri u=request.getUrl();if("file".equals(u.getScheme()))return false;if("https".equals(u.getScheme())||"http".equals(u.getScheme()))try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(ActivityNotFoundException e){}return true;}});
            if(state!=null)web.restoreState(state);else web.loadUrl("file:///android_asset/index.html");
           }
           @Override protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}
           @Override protected void onPause(){web.evaluateJavascript("if(typeof AudioEngine!=='undefined'&&AudioEngine.ctx)AudioEngine.ctx.suspend()",null);web.onPause();super.onPause();}
           @Override protected void onResume(){super.onResume();if(web!=null){web.onResume();web.evaluateJavascript("if(typeof AudioEngine!=='undefined'&&AudioEngine.ctx&&AudioEngine.playing)AudioEngine.ctx.resume()",null);}}
           @Override public void onBackPressed(){new AlertDialog.Builder(this).setTitle("Depósito Cero").setMessage("¿Salir? La partida se guarda automáticamente.").setPositiveButton("Salir",(d,w)->finish()).setNegativeButton("Seguir jugando",null).show();}
          }
          FILE_END
          cat > android/AndroidManifest.xml <<'FILE_END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="es.xescotejedor.depositocero" android:versionCode="1" android:versionName="1.0">
          <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>
          <application android:label="Depósito Cero" android:icon="@drawable/icon" android:allowBackup="false" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          </application></manifest>
          FILE_END
          cat > android/TestManifest.xml <<'FILE_END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="es.xescotejedor.depositocero.tests"><uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/><instrumentation android:name="es.xescotejedor.depositocero.GameTest" android:targetPackage="es.xescotejedor.depositocero"/><application android:label="Depósito Cero tests"/></manifest>
          FILE_END
          cat > android/prepare.py <<'FILE_END'
          from pathlib import Path
          import re,urllib.request
          p=Path('out/assets/index.html'); s=p.read_text();s=re.sub(r'<link[^>]+(?:fonts.googleapis.com|fonts.gstatic.com)[^>]*>','',s);s=s.replace('</head>','<style>@font-face{font-family:"Space Grotesk";src:url("space-grotesk.ttf")} html{overscroll-behavior:none}</style></head>');s=s.replace('<h3>GUÍA DE LA AVENTURA</h3>','<h3>GUÍA DE LA AVENTURA</h3>'+'<button type="button" class="deco-btn" onclick="document.getElementById(\'full-guide\').hidden=false">GUÍA PASO A PASO · TODOS LOS FINALES</button><p>Incluida sin conexión. Contiene spoilers.</p>');s=s.replace('</body>','<div id="full-guide" hidden style="position:fixed;inset:0;z-index:9999;background:#12100c"><button type="button" onclick="document.getElementById(\'full-guide\').hidden=true" style="position:absolute;top:8px;right:8px;z-index:2;background:#241c11;color:#f2c678;padding:12px;border:1px solid #856337">CERRAR GUÍA</button><iframe title="Guía completa de Depósito Cero" src="guide.html" style="width:100%;height:100%;border:0;padding-top:52px;box-sizing:border-box"></iframe></div>'+'</body>');p.write_text(s)
          # Official Google Fonts repository includes the font and its open font license.
          base='https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/'
          for src,dst in [('SpaceGrotesk[wght].ttf','space-grotesk.ttf'),('OFL.txt','SPACE-GROTESK-LICENSE.txt')]:
           urllib.request.urlretrieve(base+urllib.parse.quote(src),'out/assets/'+dst)
          Path('out/res/drawable/icon.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#16130e" android:pathData="M0,0h108v108h-108z"/><path android:strokeColor="#e8a33d" android:strokeWidth="6" android:fillColor="#00000000" android:pathData="M54,23a31,31 0,1 0,0 62a31,31 0,1 0,0 -62"/><path android:fillColor="#e8a33d" android:pathData="M54,43a11,11 0,1 0,0 22a11,11 0,1 0,0 -22"/></vector>''')
          assert 'fonts.googleapis.com' not in s

